<!DOCTYPE html>
<html>
<head>
    <title>Complete Crowd Management Dashboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #ffffff;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1a1a3e, #2d1b69);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header h1 {
            font-size: 24px;
            background: linear-gradient(90deg, #00d4ff, #7b2ffc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .status {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .status.safe { background: #00d4ff20; color: #00d4ff; border: 1px solid #00d4ff; }
        .status.warning { background: #f9ca2420; color: #f9ca24; border: 1px solid #f9ca24; }
        .status.critical { background: #e9456020; color: #e94560; border: 1px solid #e94560; }
        .status.idle { background: #66666620; color: #888888; border: 1px solid #666666; }
        .status.complete { background: #00d47a20; color: #00d47a; border: 1px solid #00d47a; }
        
        .dashboard {
            display: grid;
            grid-template-columns: 3fr 2fr;
            gap: 20px;
            padding: 20px;
            max-height: calc(100vh - 80px);
            overflow: hidden;
        }
        .video-section {
            background: #16213e;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .video-section img {
            width: 100%;
            border-radius: 8px;
            background: #0a0a1a;
            flex: 1;
            min-height: 300px;
            object-fit: contain;
        }
        .video-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .video-controls input[type="file"] { display: none; }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 13px;
        }
        .btn:hover { transform: scale(1.05); opacity: 0.9; }
        .btn-primary { background: #00d4ff; color: #0a0a1a; }
        .btn-danger { background: #e94560; color: white; }
        .btn-success { background: #00d47a; color: white; }
        .btn-secondary { background: #2d2d44; color: white; }
        
        .stats-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            padding-right: 5px;
        }
        .stats-panel::-webkit-scrollbar { width: 4px; }
        .stats-panel::-webkit-scrollbar-track { background: #1a1a3e; border-radius: 2px; }
        .stats-panel::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 2px; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .stat-card {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0,0,0,0.3); }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            margin: 5px 0;
        }
        .stat-number.green { color: #00d4ff; }
        .stat-number.yellow { color: #f9ca24; }
        .stat-number.red { color: #e94560; }
        .stat-number.gray { color: #888888; }
        .stat-label {
            color: #8892b0;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .density-bar {
            width: 100%;
            height: 6px;
            background: #1a1a3e;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .density-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        
        .exit-loads {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
        }
        .exit-load-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 5px 0;
            padding: 5px 10px;
            border-radius: 6px;
            background: #1a1a3e;
        }
        .exit-load-bar {
            flex: 1;
            height: 8px;
            background: #2d2d44;
            border-radius: 4px;
            overflow: hidden;
        }
        .exit-load-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .grid-map {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .grid-map canvas {
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            background: #0a0a1a;
        }
        .grid-legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #8892b0;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
        
        .alerts-container {
            background: #16213e;
            border-radius: 12px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
        }.alerts-container {
    background: #16213e;
    border-radius: 12px;
    padding: 15px;
    max-height: 700px;      /* was 500px */
    min-height: 350px;      /* optional */
    overflow-y: auto;
}
        .alerts-container::-webkit-scrollbar { width: 8px; }
        .alerts-container::-webkit-scrollbar-track { background: #1a1a3e; border-radius: 2px; }
        .alerts-container::-webkit-scrollbar-thumb { background: #e94560; border-radius: 2px; }
        .alert-item {
            padding: 6px 10px;
            margin: 3px 0;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .alert-item.critical { background: #e9456030; border-left: 3px solid #e94560; }
        .alert-item.warning { background: #f9ca2430; border-left: 3px solid #f9ca24; }
        .alert-item.info { background: #00d4ff30; border-left: 3px solid #00d4ff; }
        .alert-icon { font-size: 16px; }
        .alert-time { margin-left: auto; font-size: 10px; color: #666; }
        .no-alerts { color: #8892b0; text-align: center; padding: 15px; font-size: 13px; }
        
        .export-section {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        .export-section .btn { font-size: 12px; padding: 6px 12px; }
        
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
                max-height: none;
                overflow: visible;
            }
            .stats-panel { max-height: none; overflow: visible; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 Complete Crowd Management Dashboard</h1>
        <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
            <span class="status idle" id="status-indicator">⏳ Idle</span>
            <span style="color: #8892b0; font-size: 14px;" id="time-display">--:--:--</span>
        </div>
    </div>
    
    <div class="dashboard">
        <!-- Left: Video Feed -->
        <div class="video-section">
            <img id="video-feed" src="/video_feed" alt="Video Feed">
            <div class="video-controls">
                
                
                <button class="btn btn-secondary" onclick="clearAlerts()">🔔 Clear Alerts</button>
                <span style="margin-left: auto; color: #8892b0; font-size: 13px;" id="fps-display">FPS: 0</span>
            </div>
        </div>
        
        <!-- Right: Statistics -->
        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">👥 People Count</div>
                    <div class="stat-number green" id="people-count">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">📊 Density Level</div>
                    <div class="stat-number" id="density-level" style="color: #8892b0;">0%</div>
                    <div class="density-bar">
                        <div class="density-fill" id="density-fill" style="width: 0%; background: #00d4ff;"></div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">⏱️ Evacuation Time</div>
                    <div class="stat-number green" id="evac-time">0.0s</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">🚪 Exits Available</div>
                    <div class="stat-number green" id="exit-count">0</div>
                </div>
            </div>
            
            <!-- Exit Loads -->
            <div class="exit-loads">
                <h4 style="color: #8892b0; margin-bottom: 10px;">🚪 Exit Loads</h4>
                <div id="exit-loads-list">
                    <div style="color: #8892b0; text-align: center; padding: 10px;">No exits configured</div>
                </div>
            </div>
            
            <div class="grid-map">
                <h4 style="color: #8892b0; margin-bottom: 10px;">🗺️ Density Grid Map</h4>
                <canvas id="grid-canvas" width="300" height="300"></canvas>
                <div class="grid-legend">
                    <span class="legend-item"><span class="legend-color" style="background: #1a1a3e;"></span>Empty</span>
                    <span class="legend-item"><span class="legend-color" style="background: #00d4ff;"></span>Low</span>
                    <span class="legend-item"><span class="legend-color" style="background: #f9ca24;"></span>Medium</span>
                    <span class="legend-item"><span class="legend-color" style="background: #e94560;"></span>High</span>
                </div>
            </div>
            
            <div class="alerts-container" id="alerts-container">
                <h4 style="color: #8892b0; margin-bottom: 8px;">🔔 Alerts</h4>
                <div id="alerts-list">
                    <div class="no-alerts">✅ No active alerts. System is monitoring.</div>
                </div>
            </div>
            
            <div class="export-section">
                <button class="btn btn-success" onclick="exportData()">📥 Export Data</button>
                
            </div>
        </div>
    </div>

    <script>
        // Video upload
        async function uploadVideo() {
            const file = document.getElementById('videoInput').files[0];
            if (!file) {
                alert('Please select a video file first!');
                return;
            }
            
            const formData = new FormData();
            formData.append('video', file);
            
            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const result = await response.json();
                if (response.ok) {
                    document.getElementById('video-feed').src = '/video_feed?' + Date.now();
                    document.getElementById('status-indicator').className = 'status warning';
                    document.getElementById('status-indicator').textContent = '⏳ Processing...';
                } else {
                    alert('Upload failed: ' + result.message);
                }
            } catch (error) {
                console.error('Upload failed:', error);
                alert('Upload failed. Please try again.');
            }
        }
        
        async function clearAlerts() {
            try {
                await fetch('/clear_alerts', { method: 'POST' });
                document.getElementById('alerts-list').innerHTML = '<div class="no-alerts">✅ Alerts cleared. System is monitoring.</div>';
            } catch (error) {
                console.error('Failed to clear alerts:', error);
            }
        }
        
        async function exportData() {
            try {
                const response = await fetch('/api/export_data');
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'evacuation_data.json';
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                }
            } catch (error) {
                console.error('Export failed:', error);
                alert('Failed to export data. Please try again.');
            }
        }
        
        function refreshStats() { fetchStats(); }
        
        // Stats polling
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('Stats fetch failed:', error);
            }
        }
        
        function updateDashboard(data) {
            // People count
            document.getElementById('people-count').textContent = data.total_people || 0;
            
            // Density
            const densityLevel = data.density_level || 0;
            const densityFill = document.getElementById('density-fill');
            const densityLabel = document.getElementById('density-level');
            
            let color = '#00d4ff';
            let label = 'LOW';
            if (densityLevel < 20) { label = 'LOW'; color = '#00d4ff'; }
            else if (densityLevel < 50) { label = 'MEDIUM'; color = '#f9ca24'; }
            else if (densityLevel < 80) { label = 'HIGH'; color = '#e94560'; }
            else { label = 'CRITICAL'; color = '#ff0000'; }
            
            densityFill.style.width = Math.min(densityLevel, 100) + '%';
            densityFill.style.background = color;
            densityLabel.textContent = Math.round(densityLevel) + '%';
            densityLabel.style.color = color;
            
            // Evacuation time
            document.getElementById('evac-time').textContent = (data.evacuation_time || 0).toFixed(1) + 's';
            
            // Exit count
            const exits = data.exits || [];
            document.getElementById('exit-count').textContent = exits.length;
            
            // Update exit loads
            updateExitLoads(data.exit_loads || {}, exits);
            
            // FPS
            document.getElementById('fps-display').textContent = `FPS: ${(data.fps || 0).toFixed(1)}`;
            
            // Status
            const status = document.getElementById('status-indicator');
            const statusText = data.status || 'idle';
            
            if (statusText === 'processing') {
                status.className = 'status warning';
                status.textContent = '⏳ Processing...';
            } else if (statusText === 'complete') {
                status.className = 'status complete';
                status.textContent = '✅ Complete';
            } else if (densityLevel > 50) {
                status.className = 'status critical';
                status.textContent = '🚨 CRITICAL';
            } else if (densityLevel > 20) {
                status.className = 'status warning';
                status.textContent = '⚠️ WARNING';
            } else {
                status.className = 'status safe';
                status.textContent = '✅ All Clear';
            }
            
            // Time
            if (data.timestamp) {
                const date = new Date(data.timestamp * 1000);
                document.getElementById('time-display').textContent = date.toLocaleTimeString();
            }
            
            // Grid visualization
            if (data.density_grid && data.density_grid.length > 0) {
                drawGrid(data.density_grid);
            }
            
            // Fetch alerts
            fetchAlerts();
        }
        
        function updateExitLoads(exitLoads, exits) {
            const container = document.getElementById('exit-loads-list');
            if (!exits || exits.length === 0) {
                container.innerHTML = '<div style="color: #8892b0; text-align: center; padding: 10px;">No exits configured</div>';
                return;
            }
            
            let html = '';
            const colors = ['#00d4ff', '#7b2ffc', '#00d47a', '#f9ca24'];
            
            for (let i = 0; i < exits.length; i++) {
                const load = exitLoads[i] || 0;
                const capacity = 20;
                const percentage = Math.min((load / capacity) * 100, 100);
                const color = percentage < 70 ? '#00d47a' : percentage < 90 ? '#f9ca24' : '#e94560';
                
                html += `
                    <div class="exit-load-item">
                        <span style="font-weight: bold; color: ${colors[i % colors.length]};">E${i+1}</span>
                        <span style="font-size: 12px; color: #8892b0;">${Math.round(load)}/${capacity}</span>
                        <div class="exit-load-bar">
                            <div class="exit-load-fill" style="width: ${percentage}%; background: ${color};"></div>
                        </div>
                        <span style="font-size: 11px; color: ${color};">${Math.round(percentage)}%</span>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        }
        
        async function fetchAlerts() {
            try {
                const response = await fetch('/api/alerts');
                const data = await response.json();
                updateAlerts(data);
            } catch (error) {
                console.error('Alerts fetch failed:', error);
            }
        }
        
        function updateAlerts(data) {
            const container = document.getElementById('alerts-list');
            const alerts = data.alerts || [];
            
            if (alerts.length === 0) {
                container.innerHTML = '<div class="no-alerts">✅ No active alerts. System is monitoring.</div>';
                return;
            }
            
            let html = '';
            alerts.slice().reverse().forEach(alert => {
                const severityClass = alert.severity === 3 ? 'critical' : 
                                     alert.severity === 2 ? 'warning' : 'info';
                const icon = alert.severity === 3 ? '🚨' : 
                            alert.severity === 2 ? '⚠️' : 'ℹ️';
                const time = alert.timestamp ? new Date(alert.timestamp * 1000).toLocaleTimeString() : '';
                
                html += `
                    <div class="alert-item ${severityClass}">
                        <span class="alert-icon">${icon}</span>
                        <span>${alert.message || 'Alert'}</span>
                        <span class="alert-time">${time}</span>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        function drawGrid(gridData) {
            const canvas = document.getElementById('grid-canvas');
            const ctx = canvas.getContext('2d');
            const size = canvas.width;
            
            if (!gridData || gridData.length === 0) {
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, size, size);
                return;
            }
            
            const rows = gridData.length;
            const cols = gridData[0]?.length || rows;
            const cellSize = size / Math.max(rows, cols);
            
            ctx.clearRect(0, 0, size, size);
            
            let maxDensity = 0;
            const flat = gridData.flat();
            if (flat.length > 0) { maxDensity = Math.max(...flat); }
            
            gridData.forEach((row, i) => {
                row.forEach((cell, j) => {
                    const density = cell || 0;
                    let color;
                    const normalized = maxDensity > 0 ? density / maxDensity : 0;
                    
                    if (density === 0) { color = '#1a1a3e'; }
                    else if (normalized < 0.3) { color = '#00d4ff'; }
                    else if (normalized < 0.6) { color = '#f9ca24'; }
                    else { color = '#e94560'; }
                    
                    ctx.fillStyle = color;
                    ctx.fillRect(j * cellSize, i * cellSize, cellSize - 1, cellSize - 1);
                    
                    if (density > 0) {
                        ctx.fillStyle = '#ffffff';
                        ctx.font = `${Math.min(cellSize * 0.4, 14)}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(Math.round(density * 10) / 10, 
                                    j * cellSize + cellSize/2, 
                                    i * cellSize + cellSize/2);
                    }
                });
            });
        }
        
        // Poll every 500ms
        let statsInterval = setInterval(fetchStats, 5000);
        fetchStats();
        
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                clearInterval(statsInterval);
            } else {
                statsInterval = setInterval(fetchStats, 5000);
                fetchStats();
            }
        });

        document.getElementById("videoInput").addEventListener("change", uploadVideo);
        document.getElementById("videoInput").addEventListener("change", function () {
            uploadVideo();
        });
    </script>
</body>
</html>
